name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  secrets:
    # VETOR-SEC-03: bloqueia dumps, certificados, .env reais e credenciais nos commits novos.
    # O histórico anterior à limpeza ainda contém achados conhecidos; por isso o gitleaks
    # verifica só o intervalo do push/PR, e o secret-guard verifica a árvore inteira.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check tracked files (secret-guard)
        run: php scripts/security/secret-guard.php tracked

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz

      - name: Scan new commits (gitleaks)
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            RANGE="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$RANGE" .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, mbstring, pdo, pdo_sqlite, sqlite3, xml
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run TypeScript checks
        run: npm run types

      - name: Run test suite
        run: php artisan test
