; Desempenho em produção. O código fica imutável dentro da imagem: não é preciso
; conferir a data dos arquivos a cada requisição (cada deploy gera um container novo).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

; Cache de caminhos resolvidos (autoload do Composer e includes do Laravel).
realpath_cache_size=4096K
realpath_cache_ttl=600
