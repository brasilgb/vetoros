; Pool do VetorOS. O padrão da imagem oficial (pm.max_children = 5) enfileirava as
; requisições: navegação, polling de notificações e geração de relatórios disputavam
; 5 processos. Cada processo do Laravel usa ~40–60 MB; 10 processos cabem em ~600 MB.
; Conferir a memória livre da VPS (`free -m`) antes de aumentar.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Recicla processos para conter crescimento de memória em execuções longas.
pm.max_requests = 500
